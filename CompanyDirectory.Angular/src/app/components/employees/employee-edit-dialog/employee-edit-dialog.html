<h2 mat-dialog-title>{{ data.mode === 'add' ? 'Добавить сотрудника' : 'Редактировать сотрудника' }}</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-form" mat-dialog-content>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>ФИО</mat-label>
    <input matInput formControlName="fullName" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Дата рождения</mat-label>
    <input matInput [matDatepicker]="birthPicker" formControlName="birthDate" required />
    <mat-datepicker-toggle matSuffix [for]="birthPicker"></mat-datepicker-toggle>
    <mat-datepicker #birthPicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Дата приёма</mat-label>
    <input matInput [matDatepicker]="hirePicker" formControlName="hireDate" required />
    <mat-datepicker-toggle matSuffix [for]="hirePicker"></mat-datepicker-toggle>
    <mat-datepicker #hirePicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Зарплата</mat-label>
    <input matInput type="number" formControlName="salary" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Отдел</mat-label>
    <mat-select formControlName="departmentId" required>
      <mat-option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <div mat-dialog-actions align="end" class="actions">
    <button mat-button mat-dialog-close>Отмена</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Сохранить</button>
  </div>
</form>
