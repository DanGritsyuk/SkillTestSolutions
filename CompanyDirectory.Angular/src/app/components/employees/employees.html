<div class="employees-container">
  <div class="header-actions">
    <button mat-raised-button color="primary" (click)="openEditDialog()">
      <mat-icon>add</mat-icon> Добавить сотрудника
    </button>

    <div class="spacer"></div>

    <button mat-stroked-button (click)="employeeService.getHighSalary().subscribe(res => dataSource.data = res)">
      <mat-icon>attach_money</mat-icon> Высокие зарплаты
    </button>

    <button mat-stroked-button (click)="employeeService.adjustSalaries().subscribe(() => loadEmployees())">
      <mat-icon>trending_up</mat-icon> Корректировать зарплаты
    </button>

    <button mat-stroked-button color="warn" (click)="employeeService.deleteRetired().subscribe(() => loadEmployees())">
      <mat-icon>delete_forever</mat-icon> Удалить пенсионеров
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Отдел</th>
        <td mat-cell *matCellDef="let employee">{{ employee.department?.name }}</td>
        <th mat-footer-cell *matFooterCellDef>
          <input (input)="applyFilter($event, 'department')" placeholder="Фильтр" class="filter-input">
        </th>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ф.И.О.</th>
        <td mat-cell *matCellDef="let employee">{{ employee.fullName }}</td>
        <th mat-footer-cell *matFooterCellDef>
          <input (input)="applyFilter($event, 'fullName')" placeholder="Фильтр" class="filter-input">
        </th>
      </ng-container>

      <ng-container matColumnDef="birthDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Дата рождения</th>
        <td mat-cell *matCellDef="let employee">{{ employee.birthDate | date:'dd.MM.yyyy' }}</td>
        <th mat-footer-cell *matFooterCellDef>
          <input (input)="applyFilter($event, 'birthDate')" placeholder="Фильтр" class="filter-input">
        </th>
      </ng-container>

      <ng-container matColumnDef="hireDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Дата устройства</th>
        <td mat-cell *matCellDef="let employee">{{ employee.hireDate | date:'dd.MM.yyyy' }}</td>
        <th mat-footer-cell *matFooterCellDef>
          <input (input)="applyFilter($event, 'hireDate')" placeholder="Фильтр" class="filter-input">
        </th>
      </ng-container>

      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Зарплата</th>
        <td mat-cell *matCellDef="let employee">{{ employee.salary | currency:'RUB':'symbol':'1.0-2' }}</td>
        <th mat-footer-cell *matFooterCellDef>
          <input (input)="applyFilter($event, 'salary')" placeholder="Фильтр" class="filter-input">
        </th>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let employee">
          <button mat-icon-button color="primary" (click)="openEditDialog(employee)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteEmployee(employee.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
        <th mat-footer-cell *matFooterCellDef></th>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
  </div>

  <div *ngIf="dataSource.data.length === 0" class="no-data">
    <mat-icon>info</mat-icon>
    <p>Нет данных для отображения</p>
  </div>
</div>
