<div class="button-group" style="margin-bottom: 16px;">
  <button mat-raised-button color="primary" (click)="openAddDialog()">Добавить</button>
  <button mat-stroked-button color="primary" (click)="getHighSalary()">Высокая зарплата</button>
  <button mat-stroked-button color="accent" (click)="adjustSalaries()">Повысить зарплаты</button>
  <button mat-stroked-button color="warn" (click)="deleteRetired()">Удалить пенсионеров</button>
</div>

<table mat-table [dataSource]="employees" class="mat-elevation-z8" style="width: 100%;">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let e">{{ e.id }}</td>
  </ng-container>

  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef>ФИО</th>
    <td mat-cell *matCellDef="let e">{{ e.fullName }}</td>
  </ng-container>

  <ng-container matColumnDef="birthDate">
    <th mat-header-cell *matHeaderCellDef>Дата рождения</th>
    <td mat-cell *matCellDef="let e">{{ e.birthDate | date }}</td>
  </ng-container>

  <ng-container matColumnDef="hireDate">
    <th mat-header-cell *matHeaderCellDef>Дата приёма</th>
    <td mat-cell *matCellDef="let e">{{ e.hireDate | date }}</td>
  </ng-container>

  <ng-container matColumnDef="salary">
    <th mat-header-cell *matHeaderCellDef>Зарплата</th>
    <td mat-cell *matCellDef="let e">{{ e.salary | number:'1.0-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="department">
    <th mat-header-cell *matHeaderCellDef>Отдел</th>
    <td mat-cell *matCellDef="let e">{{ e.department?.name }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Действия</th>
    <td mat-cell *matCellDef="let e">
      <button mat-icon-button color="accent" (click)="openEditDialog(e)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="deleteEmployee(e)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['id', 'fullName', 'birthDate', 'hireDate', 'salary', 'department', 'actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['id', 'fullName', 'birthDate', 'hireDate', 'salary', 'department', 'actions'];"></tr>
</table>
